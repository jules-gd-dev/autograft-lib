name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read


jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pydantic
        
    - name: Run Ruff Linter
      run: ruff check autograft tests

    - name: Run Ruff Formatter
      run: ruff format --check autograft tests
      
    - name: Run Mypy Type Checker
      run: mypy autograft

  test:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install rapidfuzz numpy pydantic neo4j litellm langchain-openai langchain-community langchain-experimental llama-index-core llama-index-graph-stores-neo4j
        
    - name: Run Pytest
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v --cov=autograft --cov-fail-under=97
