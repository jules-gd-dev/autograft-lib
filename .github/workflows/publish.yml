name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - 'V*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autograft
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Extract version from tag and update pyproject.toml
      env:
        TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
      run: |
        python -c "
        import os, re
        tag = os.environ.get('TAG_NAME', '').strip()
        print(f'Raw tag: {tag}')
        version = re.sub(r'^v', '', tag, flags=re.IGNORECASE).strip()
        print(f'Extracted version: {version}')
        if version:
            with open('pyproject.toml', 'r') as f:
                content = f.read()
            new_content = re.sub(r'version\s*=\s*\"[^\"]+\"', f'version = \"{version}\"', content, count=1)
            with open('pyproject.toml', 'w') as f:
                f.write(new_content)
            print(f'Successfully updated pyproject.toml version to {version}')
        "


    - name: Install build tool
      run: python -m pip install --upgrade pip build
      
    - name: Build package
      run: python -m build
      
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

